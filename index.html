<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لها — ملتقى الشركات الناشئة والعملاء</title>
    <meta
      name="description"
      content="منصة تجمع الشركات الناشئة لعرض خدماتها وتحديد العميل الأنسب، وتسهّل للعملاء البحث والمقارنة حسب المنطقة."
    />
    <meta property="og:title" content="لها — ملتقى الشركات الناشئة والعملاء" />
    <meta
      property="og:description"
      content="منصة تجمع الشركات الناشئة لعرض خدماتها وتحديد العميل الأنسب، وتسهّل للعملاء البحث والمقارنة حسب المنطقة."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('laha-theme');
          var dark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-[#1d1d1f] dark:bg-black dark:text-[#f5f5f7] antialiased selection:bg-[#0071e3] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
